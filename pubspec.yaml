name: tower50
description: "A new Flutter project."

# 以下配置可防止该软件包被意外发布到 pub.dev。
# 对于私有软件包，建议保留此配置。
publish_to: 'none' # 如果希望发布到 pub.dev，请删除此行。

# 以下配置定义应用程序的版本号和构建号。
# 版本号由三个用点分隔的数字组成，例如 1.2.43。
# 后面可以选择添加一个由 + 分隔的构建号。
# 在执行 flutter build 时，可以分别使用 --build-name 和 --build-number
# 来覆盖版本号和构建号。
#
# 在 Android 中，build-name 用作 versionName，
# 而 build-number 用作 versionCode。
# 有关 Android 版本管理的更多信息，请参阅：
# https://developer.android.com/studio/publish/versioning
#
# 在 iOS 中，build-name 用作 CFBundleShortVersionString，
# 而 build-number 用作 CFBundleVersion。
# 有关 iOS 版本管理的更多信息，请参阅：
# https://developer.apple.com/library/archive/documentation/General/Reference/InfoPlistKeyReference/Articles/CoreFoundationKeys.html
#
# 在 Windows 中，build-name 用作产品版本号和文件版本号的
# 主版本号、次版本号和修订号，
# 而 build-number 用作构建版本的后缀。
version: 1.0.0+1

environment:
  sdk: ^3.12.2

# dependencies 用于指定项目运行所需的其他软件包。
# 如果希望自动将依赖项升级到最新版本，
# 可以运行 flutter pub upgrade --major-versions。
# 也可以手动修改下方的依赖版本号。
# 要查看哪些依赖项有更新版本，
# 可以运行 flutter pub outdated。
dependencies:
  flutter:
    sdk: flutter

  # 以下依赖用于在应用程序中添加 Cupertino 图标字体。
  # 可以使用 CupertinoIcons 类来显示 iOS 风格的图标。
  cupertino_icons: ^1.0.8
  window_manager: ^0.5.2

dev_dependencies:
  flutter_test:
    sdk: flutter

  # 以下 flutter_lints 软件包包含一组推荐的代码规范，
  # 用于鼓励开发者遵循良好的编程实践。
  # 这些代码规范通过项目根目录下的 analysis_options.yaml 文件启用。
  # 有关如何禁用特定规则以及启用其他规则的信息，
  # 请参阅该文件。
  flutter_lints: ^6.0.0

# 有关此文件中 Dart 通用配置部分的更多信息，
# 请参阅以下页面：
# https://dart.dev/tools/pub/pubspec

# 以下部分是 Flutter 软件包专用的配置。
flutter:

  # 以下配置确保应用程序中包含 Material Icons 图标字体，
  # 以便可以使用 material Icons 类中的图标。
  uses-material-design: true

  # 如果需要向应用程序添加资源文件，
  # 可以添加 assets 配置，例如：
  # assets:
  #   - images/a_dot_burr.jpeg
  #   - images/a_dot_ham.jpeg
  assets:
    - assets/icons/

  # 一个图片资源可以对应一个或多个不同分辨率的变体，
  # 以适配不同像素密度的设备。
  # 详细信息请参阅：
  # https://flutter.dev/to/resolution-aware-images

  # 有关从软件包依赖中添加资源文件的详细信息，
  # 请参阅：
  # https://flutter.dev/to/asset-from-package

  # 如果需要向应用程序添加自定义字体，
  # 可以在当前 flutter 配置部分中添加 fonts 配置。
  #
  # 每个字体条目都应包含：
  # family：字体系列名称。
  # fonts：字体文件列表，包含文件路径及其他字体属性。
  #
  # 例如：
  # fonts:
  #   - family: Schyler
  #     fonts:
  #       - asset: fonts/Schyler-Regular.ttf
  #       - asset: fonts/Schyler-Italic.ttf
  #         style: italic
  #   - family: Trajan Pro
  #     fonts:
  #       - asset: fonts/TrajanPro.ttf
  #       - asset: fonts/TrajanPro_Bold.ttf
  #         weight: 700
  #
  # 有关从软件包依赖中使用字体的详细信息，
  # 请参阅：
  # https://flutter.dev/to/font-from-package